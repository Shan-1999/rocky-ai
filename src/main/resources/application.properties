# spring.datasource.password=${DB_PASSWORD}
# spring.jpa.hibernate.ddl-auto=update
# spring.jpa.show-sql=true

tavily.api.key=${TAVILY_API_KEY}

# Spring AI to initialize the vector schema automatically
spring.ai.vectorstore.pgvector.initialize-schema=true


# Neon Cloud Database Connection
spring.datasource.url=jdbc:postgresql://ep-misty-field-an5iwv6a.c-6.us-east-1.aws.neon.tech/neondb?sslmode=require
spring.datasource.username=${NEON_DB_USERNAME}
spring.datasource.password=${NEON_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ==========================================
# 👂 THE EARS: GROQ (Open-Source Whisper)
# ==========================================
spring.ai.openai.audio.transcription.base-url=https://api.groq.com/openai
spring.ai.openai.audio.transcription.api-key=${OPENAI_API_KEY}
spring.ai.openai.audio.transcription.options.model=whisper-large-v3



elevenlabs.api-key=${ELEVEN_LABS_API_KEY}

